[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "coingrep"
version = "0.1.0"
description = "A CLI crypto portfolio tracker — market data, wallets, and more."
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Muhammad Ahmad Ahasn", email = "ahmadahsan7173@gmail.com" }
]

dependencies = [
  "click>=8.0",
  "requests>=2.28",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.scripts]
coingrep = "app.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
src = ["app"]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"