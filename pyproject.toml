[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coingrep"
version = "1.0.0"
description = "Crypto portfolio tracker — market data, wallets, and more."
readme = "README.MD"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
coingrep = "app.cli:cli"

[tool.setuptools]
packages = ["app"]